name: Crypto Bot

on:
  schedule:
    # ogni ora al minuto 7 (evita il picco di carico di GitHub allo scoccare dell'ora)
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Invia subito il report su Telegram"
        type: boolean
        default: false
      dry_run:
        description: "Simula senza inviare ordini"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REPORT: ${{ inputs.force_report && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python bot.py

      # Salva la data dell'ultimo report, cosi' non viene rimandato nella stessa sera
      - name: Salva stato
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "crypto-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Report giornaliero inviato"
            git push
          fi
