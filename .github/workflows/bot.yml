name: Crypto Bot

on:
  schedule:
    # GitHub salta spesso gli avvii programmati: ogni job resta acceso ~5h40
    # e controlla il mercato ogni ora, quindi basta che ne parta uno ogni
    # tanto. Gli avvii orari che arrivano mentre un job e' attivo restano in
    # coda (concurrency) e partono appena finisce: copertura continua.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Invia subito il report su Telegram"
        type: boolean
        default: false
      dry_run:
        description: "Simula senza inviare ordini"
        type: boolean
        default: false
      loop:
        description: "Resta acceso ~6 ore (altrimenti un solo controllo)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REPORT: ${{ inputs.force_report && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.loop) && '340' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py
